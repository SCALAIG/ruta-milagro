<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Ruta Milagro — Circular 18/2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F6F4EE; --surface:#FFFFFF; --ink:#1A2233; --primary:#1E3A5F; --primary-dark:#14293F;
    --accent:#C2703D; --border:#DDD8CB; --muted:#5B6472;
    --success:#2F7D5B; --success-bg:#E7F2EC; --warning:#B4790A; --warning-bg:#FBF0DD; --danger:#B23B3B; --danger-bg:#FAEAEA;
    --p2:#2F7D5B; --p2bg:#E7F2EC; --p3:#6B4FA0; --p3bg:#F0EAFA; --p4:#C2703D; --p4bg:#FBEFE3;
    --p5:#AD4368; --p5bg:#FAEAF0; --p6:#22798A; --p6bg:#E4F1F3;
    /* Relleno horizontal/vertical de página: se reduce en pantallas angostas (celular) para que el
       contenido use el ancho disponible en lugar de dejarlo comprimido entre márgenes fijos de 40px. */
    --pgx:40px; --pgy:48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); font-family:'IBM Plex Sans', sans-serif; color:var(--ink); overflow-x:hidden; }
  h1,h2,h3 { font-family:'Fraunces', serif; margin:0; }
  a { color:inherit; text-decoration:none; }
  button { font-family:'IBM Plex Sans', sans-serif; cursor:pointer; border:none; background:none; }
  label { font-family:'IBM Plex Sans', sans-serif; }
  select, input, textarea { font-family:'IBM Plex Sans', sans-serif; font-size:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .stepicon { font-size:18px; width:34px; height:34px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(0,0,0,0.06); }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:0 12px 10px 12px; position:sticky; top:0; background:var(--surface); }
  td { padding:11px 12px; font-size:13px; border-top:1px solid var(--border); }

  /* Cuadrículas reutilizadas en Resumen, Main y Control — el número de columnas
     se reduce en pantallas angostas para que cada celda quede legible en un celular. */
  .grid-4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
  .grid-3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
  .grid-6 { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; }
  .grid-side { display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:stretch; }

  @media (max-width:900px) {
    .grid-side { grid-template-columns:1fr; }
  }
  @media (max-width:760px) {
    :root { --pgx:20px; --pgy:28px; }
    .grid-4 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .grid-6 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  }
  @media (max-width:480px) {
    :root { --pgx:16px; --pgy:20px; }
    .grid-4 { grid-template-columns:1fr; }
    .grid-3 { grid-template-columns:1fr; }
    .grid-6 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    h2 { font-size:22px !important; }
  }
</style>

</head>
<body>
<div id="app"></div>
<script>
const GROUPS_DATA = [
  { id:1, pct:30, min:5, chambers:['Bogotá','Medellín para Antioquia','Cali','Barranquilla','Bucaramanga','Cartagena','Aburrá Sur','Pereira por Risaralda','Villavicencio','Cúcuta','Huila','Manizales por Caldas','Oriente Antioqueño','Santa Marta para el Magdalena','Facatativá y Noroccidente de Cundinamarca','Montería','Ibagué'] },
  { id:2, pct:20, min:5, chambers:['Valledupar para el Valle del Río Cesar','Casanare','Cauca','Pasto','Armenia y del Quindío','Tunja','Palmira','Barrancabermeja','Sincelejo','La Guajira'] },
  { id:3, pct:10, min:2, chambers:['Urabá','Chocó','Florencia (para el Caquetá)','Tuluá','Putumayo','Cartago','Sur y Oriente del Tolima','Duitama','Aguachica','Buga','Buenaventura','Girardot, Alto Magdalena y Tequendama','Dosquebradas','Sogamoso','Magdalena Medio y Nordeste Antioqueño'] },
  { id:4, pct:5, min:2, chambers:['Ocaña','San Andrés, Providencia y Santa Catalina','La Dorada, Puerto Boyacá, Puerto Salgar y Oriente de Caldas','Ipiales','Piedemonte Araucano','Honda, Guaduas y Norte del Tolima','Tumaco','Arauca','Magangué'] },
  { id:5, pct:1, min:2, chambers:['San José','Soacha','Santa Rosa de Cabal','Pamplona','Amazonas','Chinchiná','Sevilla'] }
];
const GROUP_INFO = { 1:{pct:30,min:5}, 2:{pct:20,min:5}, 3:{pct:10,min:2}, 4:{pct:5,min:2}, 5:{pct:1,min:2} };
const ANEXO = {};
GROUPS_DATA.forEach((g) => { g.chambers.forEach((c) => { ANEXO[c] = g.id; }); });

function formatCOP(n) {
  const rounded = Math.round(n) || 0;
  const s = Math.abs(rounded).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (rounded < 0 ? '-$ ' : '$ ') + s;
}

// Mismo agrupamiento de miles que formatCOP, pero sin el símbolo de moneda —
// para el campo de ingresos, que es un valor de entrada, no un resultado calculado.
function formatMiles(n) {
  const rounded = Math.round(n) || 0;
  return Math.abs(rounded).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// Convierte lo que el usuario escribió en un campo de plata (que se muestra con
// puntos de miles, p. ej. "1.500.000") de vuelta a un número entero. Hay que quitar
// TODOS los caracteres no numéricos, incluidos los puntos, antes de convertir —
// dejarlos y usar parseFloat los interpretaba como separador decimal (p. ej.
// "1.000" se volvía 1), lo que impedía asignar montos de más de 4 cifras.
function parseAmountInput(value) {
  const digits = (value ?? '').toString().replace(/[^0-9]/g, '');
  return parseInt(digits, 10) || 0;
}

// Nombres exactos, tal como aparecen en los encabezados del Capítulo II de la Circular.
const PROGRAMS = [
  { id:1, name:'1. Ruta Milagro: Fortalecimiento, Formalización y Crecimiento Empresarial', sub:'Modelo de acompañamiento integral a unidades productivas, emprendimientos y mipymes', diag:'Diagnóstico inicial por empresa (etapa obligatoria)', needsDiag:true },
  { id:2, name:'2. Fábricas de Productividad, Competitividad y Sostenibilidad', sub:'Intervenciones especializadas de extensionismo empresarial', diag:'Línea base y brechas por empresa', needsDiag:true },
  { id:3, name:'3. Ruta Milagro para la Internacionalización', sub:'Acompañamiento para incrementar las exportaciones no minero energéticas', diag:'Diagnóstico de internacionalización por empresa', needsDiag:true },
  { id:4, name:'4. Atracción de Inversión y Desarrollo Productivo Territorial', sub:'Promoción de inversión, encadenamientos y desarrollo productivo de los territorios', diag:'Sin diagnóstico por empresa — trabajo territorial', needsDiag:false },
  { id:5, name:'5. Turismo: Desarrollo de Territorios con Vocación Turística, Competitivos y Sostenibles', sub:'Fortalecimiento de destinos, empresas y prestadores de servicios turísticos; incluye la creación o fortalecimiento de capacidades para el desarrollo cívico, social y cultural en el marco de la promoción turística', diag:'Diagnóstico del destino, no por empresa', needsDiag:false }
];
// El Capítulo II define 5 programas (no 6): "Creación o fortalecimiento de
// capacidades para el desarrollo cívico, social y cultural" es el componente
// h. dentro del programa 5 (Turismo), no un programa aparte — así lo describe
// la Circular ("en el marco de la promoción turística"), por eso no tiene un
// mínimo individual propio ni cuenta como una casilla adicional del "de 6".
const DEFAULT_SELECTED = { 1:true, 2:true, 3:true, 4:true, 5:true };

// Mínimos exigidos por programa — tomados literalmente del Capítulo II de la Circular.
const MINIMOS = {
  1: ['Diagnóstico y caracterización inicial', 'Plan de acción', 'Al menos un indicador de resultado por beneficiario'],
  2: ['Línea base', 'Identificación de brechas', 'Plan de trabajo con asistencia técnica especializada', 'Al menos un indicador de resultado empresarial'],
  3: ['Diagnóstico de internacionalización', 'Plan de trabajo con líneas de servicio (máx. 3)', 'Al menos un indicador de seguimiento'],
  sismo: ['Fortalecimiento de capacidades productivas y recuperación de la actividad económica (numeral 1.1)', 'Acompañamiento técnico y conexión con instrumentos de financiación (numeral 1.2)', 'Al menos un indicador de resultado empresarial']
};

// Capítulo IV — Componentes transversales a los programas.
const TRANSVERSALES = [
  '1. Simplificación, Racionalización y Optimización de Trámites',
  '2. Innovación, Sofisticación Productiva y Transformación Digital',
  '3. Analítica de Datos y Trazabilidad',
  '4. Fortalecimiento del Sistema Nacional de Competitividad e Innovación y de las Comisiones Regionales de Competitividad e Innovación',
  '5. Acceso a Financiación y Gestión de Riesgos Empresariales',
  '6. Sostenibilidad, Transición Productiva y Competitividad Verde'
];
// Ver Programas.dc.html (versión previa) para la justificación textual completa de
// este mapeo, verificada contra el Capítulo II/III de la Circular.
const PROGRAM_TRANSVERSALES = {
  1: [1, 2, 4],
  2: [1, 2, 5],
  3: [1, 2, 4],
  4: [4],
  5: [1, 5],
  sismo: [2, 4]
};

// Capítulo III — línea adicional y opcional, no cuenta dentro del mínimo de
// programas del Capítulo II, y por eso queda fuera de la distribución del
// aporte en el paso 3 (Destinación).
const EXTRA_PROGRAM = {
  id: 'sismo',
  name: 'Recuperación y Reactivación Productiva — Zonas Afectadas por el Sismo del 10 de Agosto de 2026',
  sub: 'Apoyo a la reactivación económica de mipymes y unidades económicas en los municipios afectados (Decreto 1261 de 2026)',
  diag: 'Capítulo III — adicional y opcional, no cuenta dentro del mínimo',
  needsDiag: true
};

function defaultInterventions(p) {
  // El nombre queda vacío a propósito: la cámara debe escribir el nombre real de su
  // herramienta o programa, no el nombre que le da la Circular a la categoría.
  return [{ id: 'p' + p.id + '-1', nombre: '', descripcion: '', minimosChecked: {}, transversalesChecked: {} }];
}

function tabStyle(active) {
  return 'padding:14px 18px; font-size:13px; white-space:nowrap; background:transparent; border-bottom:3px solid ' +
    (active ? 'var(--accent)' : 'transparent') + '; color:' + (active ? '#fff' : '#9FB2C6') + ';';
}

// numeral VI (Seguimiento) de la Circular: "las cámaras de comercio remitirán al
// Ministerio informes TRIMESTRALES sobre la ejecución de los programas y del
// aporte, dentro de los quince (15) días hábiles siguientes al cierre de cada
// trimestre, y conservarán los soportes documentales que permitan verificar la
// trazabilidad de las intervenciones y los recursos." La Circular todavía no
// define el formato oficial de ese informe (lo hará el acto administrativo que
// el Ministerio debe expedir a más tardar el 31 de enero de 2027) — mientras
// tanto, este prototipo opera el reporte por trimestre, y separa "comprometido"
// (lo decidido/asignado) de "ejecutado" (lo realmente gastado), que es la
// distinción estándar de ejecución presupuestal pública y responde directamente
// a que la Circular pide reportar "la ejecución... del aporte".
const TRIMESTRES = [
  { id: 'T1-2027', label: '1er trimestre 2027 (ene–mar)' },
  { id: 'T2-2027', label: '2do trimestre 2027 (abr–jun)' },
  { id: 'T3-2027', label: '3er trimestre 2027 (jul–sep)' },
  { id: 'T4-2027', label: '4to trimestre 2027 (oct–dic)' }
];

function badgeStyle(kind) {
  const map = {
    success: ['var(--success-bg)', 'var(--success)'],
    warning: ['var(--warning-bg)', 'var(--warning)'],
    danger: ['var(--danger-bg)', 'var(--danger)']
  };
  const pair = map[kind] ?? map.warning;
  return 'display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; background:' + pair[0] + '; color:' + pair[1] + ';';
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + 'T23:59:59');
  const today = new Date();
  return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
}

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
}

const PROGRAM_IDS = [1, 2, 3, 4, 5];

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

// Selección de programas por cámara: determinística por cámara (no aleatoria en cada
// render), a falta de la selección real que cada cámara hará en la pantalla 2.
function pickProgramIds(h, count) {
  const offset = h % PROGRAM_IDS.length;
  const rotated = PROGRAM_IDS.slice(offset).concat(PROGRAM_IDS.slice(0, offset));
  return rotated.slice(0, count).sort((a, b) => a - b);
}

const ALL_CHAMBERS = [];
GROUPS_DATA.forEach((g) => {
  g.chambers.forEach((name) => {
    const h = hashCode(name);
    const count = g.min + (h % (7 - g.min));
    const programIds = pickProgramIds(h, count);
    const avanceByProgram = {};
    programIds.forEach((pid) => { avanceByProgram[pid] = hashCode(name + '-' + pid) % 96; });
    ALL_CHAMBERS.push({
      nombre: name,
      grupo: g.id,
      min: g.min,
      programas: count,
      programIds,
      reportado: (h % 3) !== 0,
      avance: h % 96,
      avanceByProgram
    });
  });
});

// Escapa texto ingresado por el usuario antes de insertarlo en HTML (nombres de
// herramientas, descripciones, resúmenes de avance) — este archivo se sirve como
// HTML estático sin backend, así que el propio navegador de quien lo abre es el
// único que procesa este texto; escapar evita que caracteres como < > " rompan el
// marcado o se interpreten como etiquetas.
function esc(v) {
  return (v ?? '').toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


// ---------------------------------------------------------------------------
// Estado y ciclo de render. Reemplaza el runtime de Claude (this.state /
// this.setState / sc-if / sc-for) por un patrón simple: un objeto de estado,
// una función update() que lo combina y vuelve a pintar, y funciones que arman
// el HTML de cada pantalla como texto. La lógica de negocio (computeMainVM /
// computeControlVM) es la misma que ya estaba validada, solo con
// this.state -> state y this.setState -> update.
// ---------------------------------------------------------------------------

const state = {
  view: 'resumen',       // 'resumen' | 'main' | 'control'
  screen: 1,              // pantalla activa dentro de 'main' (1 a 6)

  // Pantalla 1 — Perfil y aporte
  camara: 'Bogotá',
  grupoOverride: null,
  ingresos: '',

  // Pantalla 2 — Programas
  selected: null,          // null -> usa DEFAULT_SELECTED
  interventions: {},
  jurisdiccionAfectada: false,
  showMinAlert: false,

  // Pantalla 3 — Destinación
  amounts: {},

  // Pantalla 4 — Ejecución
  comprometidos: {},
  ejecutados: {},
  avancesTecnicos: {},
  reports: {},
  execSaved: {},
  execExpanded: {},
  execEditConfirmKey: null,
  trimestre: 'T1-2027',

  // Pantalla 5 — Reporte
  reporteGuardado: false,
  showEditConfirm: false,

  // Panel Confecámaras (Control)
  filterGrupo: null,
  selectedChamber: null
};

// Registro de manejadores de eventos para el HTML renderizado como texto: cada
// render limpia el registro y vuelve a registrar los closures vigentes; el
// atributo onclick/onchange del HTML solo guarda el índice, nunca la función.
let handlers = [];
function reg(fn) { handlers.push(fn); return handlers.length - 1; }
function H(idx, ev) { const fn = handlers[idx]; if (fn) fn(ev); }

function update(patch) {
  Object.assign(state, patch);
  render();
}

// El estado maneja todo el árbol de pantallas como texto (innerHTML completo en
// cada render), así que cálculos derivados (aporte, totales, acumulados) quedan
// automáticos apenas cambia el estado — sin depender de que el usuario haga clic
// en otro campo para "confirmar" el valor. El costo de repintar todo en cada
// tecla es que el navegador reemplaza el nodo <input> por uno nuevo, perdiendo
// el foco y el cursor; por eso render() guarda qué campo tenía el foco (y la
// posición del cursor) antes de repintar, y se lo devuelve al terminar.
function render() {
  const app = document.getElementById('app');
  const active = document.activeElement;
  let focusInfo = null;
  if (active && app.contains(active) && active.id) {
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }

  handlers = [];
  if (state.view === 'resumen') {
    app.innerHTML = renderResumen();
  } else if (state.view === 'control') {
    app.innerHTML = renderControl(computeControlVM(state));
  } else {
    app.innerHTML = renderMain(computeMainVM(state));
  }

  if (focusInfo) {
    const el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus();
      if (typeof el.setSelectionRange === 'function' && focusInfo.start != null) {
        try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) { /* algunos inputs (number) no soportan setSelectionRange */ }
      }
    }
  }
}

function goToResumen() { window.scrollTo(0, 0); update({ view: 'resumen' }); }
function enterSystem() { window.scrollTo(0, 0); update({ view: 'main', screen: 1 }); }
function goToControl() { window.scrollTo(0, 0); update({ view: 'control' }); }
function goToMainFromControl() { window.scrollTo(0, 0); update({ view: 'main' }); }
function goToMainScreen(n) { window.scrollTo(0, 0); update({ view: 'main', screen: n }); }

document.addEventListener('DOMContentLoaded', render);


function computeMainVM(state) {
    const screen = state.screen ?? 1;

    // ---------------- Pantalla 1 — Perfil y aporte ----------------
    const camara = state.camara ?? 'Bogotá';
    const assignedGrupo = ANEXO[camara] ?? 1;
    const grupo = state.grupoOverride ?? assignedGrupo;
    const info = GROUP_INFO[grupo];
    // El estado guarda solo dígitos (sin puntos); los puntos de separación de
    // miles se calculan al vuelo para mostrarlos, así el usuario los ve mientras escribe.
    const ingresosDigits = (state.ingresos ?? '').toString().replace(/[^0-9]/g, '');
    const ingresosNumeric = parseInt(ingresosDigits, 10) || 0;
    const ingresosDisplay = ingresosNumeric > 0 ? formatMiles(ingresosNumeric) : '';
    const aporte = ingresosNumeric * info.pct / 100;
    const aporteFormatted = formatCOP(aporte);

    const grupos = [1, 2, 3, 4, 5].map((id) => {
      const sel = id === grupo;
      return {
        id,
        pct: GROUP_INFO[id].pct,
        select: () => update({ grupoOverride: id }),
        pillStyle: 'padding:10px 16px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid ' +
          (sel ? 'var(--primary)' : 'var(--border)') + '; background:' + (sel ? 'var(--primary)' : '#fff') + '; color:' + (sel ? '#fff' : 'var(--ink)') + ';'
      };
    });
    const camaraGroups = GROUPS_DATA.map((g) => ({ label: 'Grupo ' + g.id + ' · ' + g.pct + '%', chambers: g.chambers }));

    // ---------------- Pantalla 2 — Programas ----------------
    const selected = state.selected ?? DEFAULT_SELECTED;
    const interventions = state.interventions ?? {};
    const jurisdiccionAfectada = !!state.jurisdiccionAfectada;
    const progCount = PROGRAMS.filter((pp) => selected[pp.id]).length;
    const MIN = info.min;
    const ok = progCount >= MIN;

    const updateField = (pid, iid, field, value) => {
      const current = interventions[pid] ?? defaultInterventions(PROGRAMS.find((pp) => pp.id === pid) ?? EXTRA_PROGRAM);
      const list = current.map((it) => (it.id === iid ? { ...it, [field]: value } : it));
      update({ interventions: { ...interventions, [pid]: list } });
    };
    const addIntervention = (pid) => {
      const prog = PROGRAMS.find((pp) => pp.id === pid) ?? EXTRA_PROGRAM;
      const current = interventions[pid] ?? defaultInterventions(prog);
      const newId = 'p' + pid + '-' + (current.length + 1) + '-' + Date.now();
      update({ interventions: { ...interventions, [pid]: [...current, { id: newId, nombre: '', descripcion: '', minimosChecked: {}, transversalesChecked: {} }] } });
    };
    const removeIntervention = (pid, iid) => {
      const prog = PROGRAMS.find((pp) => pp.id === pid) ?? EXTRA_PROGRAM;
      const current = interventions[pid] ?? defaultInterventions(prog);
      const filtered = current.filter((it) => it.id !== iid);
      update({ interventions: { ...interventions, [pid]: filtered.length ? filtered : defaultInterventions(prog) } });
    };
    const toggleMinimo = (pid, iid, idx) => {
      const prog = PROGRAMS.find((pp) => pp.id === pid) ?? EXTRA_PROGRAM;
      const current = interventions[pid] ?? defaultInterventions(prog);
      const list = current.map((it) => {
        if (it.id !== iid) return it;
        const checked = it.minimosChecked ?? {};
        return { ...it, minimosChecked: { ...checked, [idx]: !checked[idx] } };
      });
      update({ interventions: { ...interventions, [pid]: list } });
    };
    const toggleTransversal = (pid, iid, idx) => {
      const prog = PROGRAMS.find((pp) => pp.id === pid) ?? EXTRA_PROGRAM;
      const current = interventions[pid] ?? defaultInterventions(prog);
      const list = current.map((it) => {
        if (it.id !== iid) return it;
        const checked = it.transversalesChecked ?? {};
        return { ...it, transversalesChecked: { ...checked, [idx]: !checked[idx] } };
      });
      update({ interventions: { ...interventions, [pid]: list } });
    };

    const buildItem = (p) => {
      const isSel = !!selected[p.id];
      const showForm = isSel;
      const list = interventions[p.id] ?? defaultInterventions(p);
      const programMinimos = MINIMOS[p.id] ?? [];
      const programTransversalIdx = PROGRAM_TRANSVERSALES[p.id] ?? [];

      const interventionRows = list.map((it) => {
        const checkedMap = it.minimosChecked ?? {};
        const minimosRows = programMinimos.map((text, idx) => {
          const checked = !!checkedMap[idx];
          return {
            text, checked,
            toggle: () => toggleMinimo(p.id, it.id, idx),
            pillStyle: 'display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:4px; border:1px solid ' +
              (checked ? 'var(--success)' : 'var(--border)') + '; background:' + (checked ? 'var(--success-bg)' : '#fff') + '; width:100%; box-sizing:border-box; text-align:left;',
            checkStyle: 'width:16px; height:16px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:1px solid ' +
              (checked ? 'var(--success)' : 'var(--border)') + '; background:' + (checked ? 'var(--success)' : '#fff') + '; color:#fff;',
            checkMark: checked ? '✓' : ''
          };
        });

        const transversalesCheckedMap = it.transversalesChecked ?? {};
        const transversalesRows = programTransversalIdx.map((idx) => {
          const text = TRANSVERSALES[idx];
          const checked = !!transversalesCheckedMap[idx];
          return {
            text, checked,
            toggle: () => toggleTransversal(p.id, it.id, idx),
            pillStyle: 'display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:4px; border:1px solid ' +
              (checked ? 'var(--primary)' : 'var(--border)') + '; background:' + (checked ? '#EAF0F7' : '#fff') + '; width:100%; box-sizing:border-box; text-align:left;',
            checkStyle: 'width:16px; height:16px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:1px solid ' +
              (checked ? 'var(--primary)' : 'var(--border)') + '; background:' + (checked ? 'var(--primary)' : '#fff') + '; color:#fff;',
            checkMark: checked ? '✓' : ''
          };
        });

        return {
          id: it.id,
          nombre: it.nombre,
          descripcion: it.descripcion,
          minimosRows, hasMinimos: minimosRows.length > 0,
          transversalesRows, hasTransversales: transversalesRows.length > 0,
          canRemove: list.length > 1,
          onNombre: (e) => updateField(p.id, it.id, 'nombre', e.target.value),
          onDescripcion: (e) => updateField(p.id, it.id, 'descripcion', e.target.value),
          remove: () => removeIntervention(p.id, it.id)
        };
      });

      const formIntro = programMinimos.length > 0
        ? ('La Circular agrupa esta intervención bajo "' + p.name + '", pero lo que importa es la metodología, no el nombre. Registra aquí la herramienta o el programa real que tu cámara ejecuta para este propósito — puede llamarse distinto — siempre que cumpla los mínimos exigidos abajo.')
        : ('La Circular agrupa esta línea bajo "' + p.name + '". Este programa no tiene mínimos individuales en el Capítulo II — registra igual la herramienta o el programa real que tu cámara ejecuta para este propósito, aunque se llame distinto, y describe en qué consiste.');

      return {
        ...p,
        toggle: () => update({ selected: { ...selected, [p.id]: !isSel } }),
        containerStyle: 'width:100%; box-sizing:border-box; background:var(--surface); border:1px solid ' +
          (isSel ? 'var(--primary)' : 'var(--border)') + '; border-radius:4px; overflow:hidden;',
        headerStyle: 'width:100%; box-sizing:border-box; display:flex; gap:16px; align-items:flex-start; padding:20px; background:transparent;',
        checkStyle: 'width:22px; height:22px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; margin-top:2px; border:1px solid ' +
          (isSel ? 'var(--primary)' : 'var(--border)') + '; background:' + (isSel ? 'var(--primary)' : '#fff') + '; color:#fff;',
        checkMark: isSel ? '✓' : '',
        diagBadgeStyle: 'display:inline-block; margin-top:10px; padding:4px 10px; border-radius:20px; font-size:12px; background:' +
          (p.needsDiag ? 'var(--warning-bg)' : '#EFEDE4') + '; color:' + (p.needsDiag ? 'var(--warning)' : 'var(--muted)') + ';',
        showForm, formIntro, interventionRows,
        addIntervention: () => addIntervention(p.id)
      };
    };

    const items = PROGRAMS.map(buildItem);
    const sismoItems = jurisdiccionAfectada ? [buildItem(EXTRA_PROGRAM)] : [];

    // ---------------- Pantalla 3 — Destinación (en vivo) ----------------
    const amounts = state.amounts ?? {};
    const selectedPrograms = PROGRAMS.filter((pp) => selected[pp.id]);

    const categoryGroups = selectedPrograms.map((p) => {
      const list = interventions[p.id] ?? defaultInterventions(p);
      const rows = list.map((it) => {
        const amt = amounts[it.id] ?? 0;
        return {
          id: it.id,
          label: (it.nombre && it.nombre.trim()) ? it.nombre : '(sin nombre — complétalo en Programas)',
          amountDisplay: formatCOP(amt),
          amountColor: amt === 0 ? 'var(--muted)' : 'var(--ink)',
          inputId: 'amt-' + it.id,
          onChange: (e) => {
            update({ amounts: { ...amounts, [it.id]: parseAmountInput(e.target.value) } });
          }
        };
      });
      const catSum = list.reduce((acc, it) => acc + (amounts[it.id] ?? 0), 0);
      return { id: p.id, name: p.name, rows, catSum, catSumFormatted: formatCOP(catSum), catSumColor: catSum === 0 ? 'var(--muted)' : 'var(--ink)' };
    });

    const grandSum = categoryGroups.reduce((acc, c) => acc + c.catSum, 0);
    const remaining = aporte - grandSum;
    const over = grandSum > aporte;
    const destPct = aporte > 0 ? Math.max(0, Math.min(100, (grandSum / aporte) * 100)) : 0;
    const recapRows = categoryGroups.map((c) => ({ name: c.name, amountDisplay: c.catSumFormatted, amountColor: c.catSumColor }));

    // ---------------- Pantalla 4 — Ejecución (en vivo) ----------------
    // Cada HERRAMIENTA (cada intervención real que la cámara nombró en Programas)
    // tiene un reporte independiente por trimestre (1 a 4, numeral VI de la
    // Circular), no uno solo — así el avance y lo ejecutado se acumulan reporte
    // a reporte en vez de sobrescribirse. El capítulo (uno de los 5 programas)
    // sigue siendo solo el agrupador visual. El comprometido se registra por
    // herramienta (no por trimestre) y por defecto es lo que se le asignó en
    // Destinación (amounts[it.id], en vivo).
    const reports = state.reports ?? {};
    const comprometidos = state.comprometidos ?? {};
    const ejecutados = state.ejecutados ?? {};
    const avancesTecnicos = state.avancesTecnicos ?? {};
    const execSaved = state.execSaved ?? {};
    const execExpanded = state.execExpanded ?? {};
    const execEditConfirmKey = state.execEditConfirmKey ?? null;
    const trimestre = state.trimestre ?? 'T1-2027';
    const trimestreInfo = TRIMESTRES.find((t) => t.id === trimestre) ?? TRIMESTRES[0];

    const updateResumen = (tid, trimId, value) => {
      const curTool = reports[tid] ?? {};
      const curTrim = curTool[trimId] ?? { resumen: '', soportes: [] };
      update({ reports: { ...reports, [tid]: { ...curTool, [trimId]: { ...curTrim, resumen: value } } } });
    };
    const addFiles = (tid, trimId, fileList) => {
      const curTool = reports[tid] ?? {};
      const curTrim = curTool[trimId] ?? { resumen: '', soportes: [] };
      const nuevos = Array.from(fileList).map((f) => ({ id: 'f' + Date.now() + Math.random(), name: f.name }));
      update({ reports: { ...reports, [tid]: { ...curTool, [trimId]: { ...curTrim, soportes: [...curTrim.soportes, ...nuevos] } } } });
    };
    const removeFile = (tid, trimId, fid) => {
      const curTool = reports[tid] ?? {};
      const curTrim = curTool[trimId] ?? { resumen: '', soportes: [] };
      update({ reports: { ...reports, [tid]: { ...curTool, [trimId]: { ...curTrim, soportes: curTrim.soportes.filter((f) => f.id !== fid) } } } });
    };
    const updateComprometido = (tid, value) => update({ comprometidos: { ...comprometidos, [tid]: value } });
    const updateEjecutado = (tid, trimId, value) => {
      const curTool = ejecutados[tid] ?? {};
      update({ ejecutados: { ...ejecutados, [tid]: { ...curTool, [trimId]: value } } });
    };
    const updateAvanceTecnico = (tid, trimId, value) => {
      const curTool = avancesTecnicos[tid] ?? {};
      update({ avancesTecnicos: { ...avancesTecnicos, [tid]: { ...curTool, [trimId]: value } } });
    };
    // Los 4 reportes trimestrales arrancan minimizados (execExpanded vacío) para
    // que la pantalla no se alargue — el que está guardado se ve opaco con aviso
    // "Guardado ✓", el resto con aviso "Sin reporte". Guardar vuelve a minimizar
    // el reporte; abrirlo (para completarlo o para editarlo) lo expande.
    const saveExecReport = (tid, trimId) => {
      const curSaved = execSaved[tid] ?? {};
      const curExpanded = execExpanded[tid] ?? {};
      update({
        execSaved: { ...execSaved, [tid]: { ...curSaved, [trimId]: true } },
        execExpanded: { ...execExpanded, [tid]: { ...curExpanded, [trimId]: false } }
      });
    };
    const openExecReport = (tid, trimId) => {
      const curExpanded = execExpanded[tid] ?? {};
      update({ execExpanded: { ...execExpanded, [tid]: { ...curExpanded, [trimId]: true } } });
    };
    const collapseExecReport = (tid, trimId) => {
      const curExpanded = execExpanded[tid] ?? {};
      update({ execExpanded: { ...execExpanded, [tid]: { ...curExpanded, [trimId]: false } } });
    };
    const requestEditExecReport = (tid, trimId) => update({ execEditConfirmKey: tid + '|' + trimId });
    const cancelEditExecReport = () => update({ execEditConfirmKey: null });
    const confirmEditExecReport = () => {
      if (!execEditConfirmKey) return;
      const sep = execEditConfirmKey.indexOf('|');
      const ctid = execEditConfirmKey.slice(0, sep);
      const ctrim = execEditConfirmKey.slice(sep + 1);
      const curSaved = execSaved[ctid] ?? {};
      const curExpanded = execExpanded[ctid] ?? {};
      update({
        execSaved: { ...execSaved, [ctid]: { ...curSaved, [ctrim]: false } },
        execExpanded: { ...execExpanded, [ctid]: { ...curExpanded, [ctrim]: true } },
        execEditConfirmKey: null
      });
    };

    const ejecItems = selectedPrograms.map((p) => {
      const list = interventions[p.id] ?? defaultInterventions(p);

      const tools = list.map((it) => {
        const toolReports = reports[it.id] ?? {};
        const toolEjecutados = ejecutados[it.id] ?? {};
        const toolAvances = avancesTecnicos[it.id] ?? {};
        const toolSaved = execSaved[it.id] ?? {};
        const toolExpanded = execExpanded[it.id] ?? {};
        const comprometido = comprometidos[it.id] ?? (amounts[it.id] ?? 0);
        const label = (it.nombre && it.nombre.trim()) ? it.nombre : '(sin nombre — complétalo en Programas)';

        let acumulado = 0;
        const reportRows = TRIMESTRES.map((trim, idx) => {
          const curTrim = toolReports[trim.id] ?? { resumen: '', soportes: [] };
          const soportes = curTrim.soportes.map((f) => ({ id: f.id, name: f.name, remove: () => removeFile(it.id, trim.id, f.id) }));
          const ejecutadoTrim = toolEjecutados[trim.id] ?? 0;
          const avanceTrim = toolAvances[trim.id] ?? 0;
          acumulado += ejecutadoTrim;
          const saved = !!toolSaved[trim.id];
          const isOpen = !!toolExpanded[trim.id];
          const pctAcum = comprometido > 0 ? Math.round((acumulado / comprometido) * 100) : 0;

          return {
            id: it.id + '-' + trim.id,
            indexLabel: 'Reporte ' + (idx + 1),
            trimLabel: trim.label,
            showAcumulado: idx > 0,
            acumuladoDisplay: formatCOP(acumulado),
            acumuladoPctText: pctAcum + '%',
            ejecutadoTrimDisplay: formatCOP(ejecutadoTrim),
            onEjecutadoTrim: (e) => updateEjecutado(it.id, trim.id, parseAmountInput(e.target.value)),
            avanceTrim,
            onAvanceTrim: (e) => {
              let n = parseInt(e.target.value, 10);
              if (isNaN(n)) n = 0;
              n = Math.max(0, Math.min(100, n));
              updateAvanceTecnico(it.id, trim.id, n);
            },
            resumen: curTrim.resumen,
            onResumen: (e) => updateResumen(it.id, trim.id, e.target.value),
            onFiles: (e) => addFiles(it.id, trim.id, e.target.files),
            soportes, hasFiles: soportes.length > 0, noFiles: soportes.length === 0,
            saved,
            open: isOpen,
            closedSaved: !isOpen && saved,
            closedEmpty: !isOpen && !saved,
            estadoLabel: saved ? 'Guardado ✓' : 'Sin reporte',
            estadoStyle: badgeStyle(saved ? 'success' : 'warning'),
            opacityStyle: (saved && !isOpen) ? 'opacity:0.6;' : '',
            showEditBtn: saved && !isOpen,
            showCompleteBtn: !saved && !isOpen,
            showMinimizeBtn: isOpen,
            guardar: () => saveExecReport(it.id, trim.id),
            requestEdit: () => requestEditExecReport(it.id, trim.id),
            completeReport: () => openExecReport(it.id, trim.id),
            minimize: () => collapseExecReport(it.id, trim.id)
          };
        });

        const ejecutado = acumulado;
        const pctEjec = comprometido > 0 ? Math.round((ejecutado / comprometido) * 100) : 0;
        const sobreejecutado = comprometido > 0 && ejecutado > comprometido;

        return {
          id: it.id,
          label,
          comprometido, ejecutado,
          comprometidoDisplay: formatCOP(comprometido),
          onComprometido: (e) => updateComprometido(it.id, parseAmountInput(e.target.value)),
          ejecutadoDisplay: formatCOP(ejecutado),
          pctEjecText: pctEjec + '%',
          ejecBarStyle: 'height:100%; width:' + Math.max(0, Math.min(100, pctEjec)) + '%; background:' +
            (sobreejecutado ? 'var(--danger)' : (pctEjec >= 100 ? 'var(--success)' : 'var(--accent)')) + ';',
          comprometidoBadgeText: comprometido > 0 ? 'Comprometido' : 'Pendiente de comprometer',
          comprometidoBadgeStyle: badgeStyle(comprometido > 0 ? 'success' : 'warning'),
          ejecutadoBadgeText: ejecutado <= 0 ? 'Sin ejecutar' : (pctEjec >= 100 ? ('Ejecutado (' + pctEjec + '%)') : ('En ejecución (' + pctEjec + '%)')),
          ejecutadoBadgeStyle: badgeStyle(ejecutado <= 0 ? 'danger' : (pctEjec >= 100 ? 'success' : 'warning')),
          reports: reportRows
        };
      });

      const catComprometido = tools.reduce((acc, t) => acc + t.comprometido, 0);
      const catEjecutado = tools.reduce((acc, t) => acc + t.ejecutado, 0);
      const catPctEjec = catComprometido > 0 ? Math.round((catEjecutado / catComprometido) * 100) : 0;
      const catSobreejecutado = catComprometido > 0 && catEjecutado > catComprometido;

      return {
        id: p.id, name: p.name, tools,
        comprometido: catComprometido, ejecutado: catEjecutado,
        comprometidoDisplay: formatCOP(catComprometido),
        ejecutadoDisplay: formatCOP(catEjecutado),
        pctEjecText: catPctEjec + '%',
        ejecBarStyle: 'height:100%; width:' + Math.max(0, Math.min(100, catPctEjec)) + '%; background:' +
          (catSobreejecutado ? 'var(--danger)' : (catPctEjec >= 100 ? 'var(--success)' : 'var(--accent)')) + ';',
        ejecutadoBadgeText: catEjecutado <= 0 ? 'Sin ejecutar' : (catPctEjec >= 100 ? ('Ejecutado (' + catPctEjec + '%)') : ('En ejecución (' + catPctEjec + '%)')),
        ejecutadoBadgeStyle: badgeStyle(catEjecutado <= 0 ? 'danger' : (catPctEjec >= 100 ? 'success' : 'warning'))
      };
    });

    const totalComprometido = ejecItems.reduce((acc, c) => acc + c.comprometido, 0);
    const totalEjecutado = ejecItems.reduce((acc, c) => acc + c.ejecutado, 0);
    const totalPctEjec = totalComprometido > 0 ? Math.round((totalEjecutado / totalComprometido) * 100) : 0;

    // ---------------- Pantalla 6 — Panel de estado (en vivo) ----------------
    // Fusionado desde Panel.dc.html (antes un archivo aparte con datos de
    // ejemplo). El avance ahora se lee de ejecItems, calculado arriba con lo que
    // la cámara realmente registró en Ejecución — nada queda simulado aquí.
    const deadlineRaw = [
      { label: 'AJUSTE DE CLASIFICACIÓN (ANEXO 1)', date: '2026-11-15' },
      { label: 'REPORTE INICIAL AL MINISTERIO', date: '2027-01-31' },
      { label: 'GUÍA METODOLÓGICA MINCIT + CONFECÁMARAS', date: '2027-01-31' }
    ];
    const deadlines = deadlineRaw.map((d) => {
      const days = daysUntil(d.date);
      const past = days < 0;
      return {
        label: d.label,
        dateText: fmtDate(d.date),
        daysText: past ? 'Vencido' : (days + ' días'),
        color: past ? 'var(--muted)' : (days <= 30 ? 'var(--danger)' : (days <= 90 ? 'var(--warning)' : 'var(--success)'))
      };
    });

    // El año de ejecución que exige la Circular es el año calendario 2027 (asunto:
    // "programas que deberán ejecutar las cámaras de comercio en el año 2027").
    const anoInicio = new Date('2027-01-01T00:00:00');
    const anoFin = new Date('2027-12-31T23:59:59');
    const anoHoy = new Date();
    const anoTotalDias = Math.round((anoFin - anoInicio) / (1000 * 60 * 60 * 24)) + 1;
    let anoEjecLabel, anoEjecDetail, anoEjecPct;
    if (anoHoy < anoInicio) {
      const faltan = Math.ceil((anoInicio - anoHoy) / (1000 * 60 * 60 * 24));
      anoEjecLabel = 'Aún no inicia';
      anoEjecDetail = 'Comienza en ' + faltan + ' días (1 de enero de 2027).';
      anoEjecPct = 0;
    } else if (anoHoy > anoFin) {
      anoEjecLabel = 'Año finalizado';
      anoEjecDetail = 'El año de ejecución 2027 concluyó el 31 de diciembre de 2027.';
      anoEjecPct = 100;
    } else {
      const transcurridos = Math.floor((anoHoy - anoInicio) / (1000 * 60 * 60 * 24)) + 1;
      anoEjecPct = Math.round((transcurridos / anoTotalDias) * 100);
      anoEjecLabel = 'Día ' + transcurridos + ' de ' + anoTotalDias;
      anoEjecDetail = anoEjecPct + '% del año transcurrido, desde el 1 de enero de 2027.';
    }
    const anoEjecBarStyle = 'height:100%; width:' + Math.max(0, Math.min(100, anoEjecPct)) + '%; background:var(--accent);';
    const hasEjecItems = ejecItems.length > 0;
    const noEjecItems = ejecItems.length === 0;

    // ---------------- Pantalla 5 — Reporte (en vivo) ----------------
    const reporteGuardado = !!state.reporteGuardado;
    const showEditConfirm = !!state.showEditConfirm;
    const scrollTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };

    return {
      screen,
      isScreen1: screen === 1, isScreen2: screen === 2, isScreen3: screen === 3, isScreen4: screen === 4, isScreen5: screen === 5, isScreen6: screen === 6,
      goTo1: () => { scrollTop(); update({ screen: 1 }); },
      goTo2: () => { scrollTop(); update({ screen: 2 }); },
      goTo3: () => { scrollTop(); update({ screen: 3 }); },
      goTo4: () => { scrollTop(); update({ screen: 4 }); },
      goTo5: () => { scrollTop(); update({ screen: 5 }); },
      goTo6: () => { scrollTop(); update({ screen: 6 }); },
      tab1Style: tabStyle(screen === 1),
      tab2Style: tabStyle(screen === 2),
      tab3Style: tabStyle(screen === 3),
      tab4Style: tabStyle(screen === 4),
      tab5Style: tabStyle(screen === 5),
      tab6Style: tabStyle(screen === 6),
      camaraHeaderText: 'Cámara de Comercio de ' + camara + ' · Grupo ' + grupo,

      // Pantalla 1
      camara, camaraGroups,
      onCamaraChange: (e) => update({ camara: e.target.value, grupoOverride: null }),
      grupos, pct: info.pct, minPrograms: info.min, ingresosDisplay, aporteFormatted,
      onIngresosChange: (e) => {
        const digits = e.target.value.replace(/[^0-9]/g, '');
        update({ ingresos: digits });
      },
      overridden: grupo !== assignedGrupo, assignedGrupo,

      // Pantalla 2
      grupo, min: MIN, progCount,
      bannerText: ok
        ? ('Cumple el mínimo requerido: ' + progCount + ' de 5 programas seleccionados (mínimo ' + MIN + ').')
        : ('Faltan ' + (MIN - progCount) + ' programa(s) para llegar al mínimo de ' + MIN + ' de 5 exigido a Grupo ' + grupo + '.'),
      bannerStyle: 'padding:14px 18px; border-radius:4px; font-size:14px; font-weight:600; background:' +
        (ok ? 'var(--success-bg)' : 'var(--danger-bg)') + '; color:' + (ok ? 'var(--success)' : 'var(--danger)') + ';',
      items,
      showMinAlert: !!state.showMinAlert,
      minAlertText: 'Tu cámara pertenece al Grupo ' + grupo + ' y debe seleccionar mínimo ' + MIN + ' de los 5 programas del Capítulo II. Actualmente tienes ' + progCount + ' seleccionado(s) — selecciona ' + (MIN - progCount) + ' más antes de continuar.',
      closeMinAlert: () => update({ showMinAlert: false }),
      continueToDestinacion: () => {
        if (!ok) { update({ showMinAlert: true }); } else { scrollTop(); update({ screen: 3 }); }
      },
      hasSismo: jurisdiccionAfectada, sismoItems,
      toggleSismo: () => update({ jurisdiccionAfectada: !jurisdiccionAfectada }),
      sismoTogglePillStyle: 'display:flex; align-items:center; gap:10px; padding:2px; background:transparent; width:100%; text-align:left;',
      sismoToggleCheckStyle: 'width:18px; height:18px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:1px solid ' +
        (jurisdiccionAfectada ? 'var(--primary)' : 'var(--border)') + '; background:' + (jurisdiccionAfectada ? 'var(--primary)' : '#fff') + '; color:#fff;',
      sismoToggleCheckMark: jurisdiccionAfectada ? '✓' : '',

      // Pantalla 3
      categoryGroups, recapRows,
      totalFormatted: aporteFormatted, grupoPct: info.pct,
      sumFormatted: formatCOP(grandSum), remainingFormatted: formatCOP(remaining),
      sumColor: over ? 'var(--danger)' : 'var(--ink)',
      barStyle: 'height:100%; width:' + destPct + '%; background:' + (over ? 'var(--danger)' : 'var(--accent)') + ';',

      // Pantalla 4
      ejecItems,
      trimestres: TRIMESTRES,
      trimestre,
      trimestreLabel: trimestreInfo.label,
      onTrimestreChange: (e) => update({ trimestre: e.target.value }),
      totalComprometidoFormatted: formatCOP(totalComprometido),
      totalEjecutadoFormatted: formatCOP(totalEjecutado),
      totalPctEjecText: totalPctEjec + '%',
      totalEjecBarStyle: 'height:100%; width:' + Math.max(0, Math.min(100, totalPctEjec)) + '%; background:' +
        (totalEjecutado > totalComprometido && totalComprometido > 0 ? 'var(--danger)' : (totalPctEjec >= 100 ? 'var(--success)' : 'var(--accent)')) + ';',
      showExecEditConfirm: !!execEditConfirmKey,
      cancelExecEdit: cancelEditExecReport,
      confirmExecEdit: confirmEditExecReport,

      // Pantalla 5
      reporteGuardado, reporteNoGuardado: !reporteGuardado,
      estadoLabel: reporteGuardado ? 'Guardado ✓' : 'Borrador — sin guardar',
      estadoStyle: 'padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; background:' +
        (reporteGuardado ? 'var(--success-bg)' : 'var(--warning-bg)') + '; color:' + (reporteGuardado ? 'var(--success)' : 'var(--warning)') + ';',
      reportOpacityStyle: reporteGuardado ? 'opacity:0.55;' : '',
      guardarReporte: () => update({ reporteGuardado: true }),
      requestEdit: () => update({ showEditConfirm: true }),
      showEditConfirm,
      confirmEdit: () => update({ reporteGuardado: false, showEditConfirm: false }),
      cancelEdit: () => update({ showEditConfirm: false }),

      // Pantalla 6
      deadlines,
      anoEjecLabel, anoEjecDetail, anoEjecBarStyle,
      hasEjecItems, noEjecItems
    };
  }

function computeControlVM(state) {
    const filterGrupo = state.filterGrupo ?? null;
    const selectedName = state.selectedChamber ?? null;
    const visible = filterGrupo ? ALL_CHAMBERS.filter((c) => c.grupo === filterGrupo) : ALL_CHAMBERS;

    const rows = visible.map((c) => {
      const isSelected = c.nombre === selectedName;
      return {
        nombre: c.nombre,
        grupo: c.grupo,
        programas: c.programas,
        reportLabel: c.reportado ? 'Sí' : 'No',
        reportStyle: 'padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; background:' +
          (c.reportado ? 'var(--success-bg)' : 'var(--danger-bg)') + '; color:' + (c.reportado ? 'var(--success)' : 'var(--danger)') + ';',
        avancePct: c.avance + '%',
        rowStyle: isSelected ? 'background:var(--success-bg);' : '',
        select: () => update({ selectedChamber: isSelected ? null : c.nombre }),
        selectButtonStyle: 'padding:6px 12px; border-radius:4px; font-size:12px; font-weight:600; background:' +
          (isSelected ? 'var(--primary)' : 'transparent') + '; color:' + (isSelected ? '#fff' : 'var(--primary)') + '; border:1px solid var(--primary);',
        selectButtonLabel: isSelected ? 'Viendo ✓' : 'Ver por ruta →'
      };
    });

    const reportedCount = ALL_CHAMBERS.filter((c) => c.reportado).length;
    const pendingCount = ALL_CHAMBERS.length - reportedCount;
    const laggingCount = ALL_CHAMBERS.filter((c) => (c.grupo === 1 || c.grupo === 2) && !c.reportado).length;

    const filters = [{ id: null, label: 'Todas' }].concat(GROUPS_DATA.map((g) => ({ id: g.id, label: 'Grupo ' + g.id }))).map((f) => {
      const active = f.id === filterGrupo;
      return {
        label: f.label,
        select: () => update({ filterGrupo: f.id }),
        style: 'padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid ' +
          (active ? 'var(--primary)' : 'var(--border)') + '; background:' + (active ? 'var(--primary)' : '#fff') +
          '; color:' + (active ? '#fff' : 'var(--ink)') + ';'
      };
    });

    const programStats = PROGRAMS.map((p) => {
      const runners = ALL_CHAMBERS.filter((c) => c.programIds.includes(p.id));
      const avg = runners.length ? Math.round(runners.reduce((sum, c) => sum + c.avanceByProgram[p.id], 0) / runners.length) : 0;
      return { name: p.name, count: runners.length, avgText: avg + '%' };
    });

    const selectedChamber = selectedName ? ALL_CHAMBERS.find((c) => c.nombre === selectedName) : null;
    const selected = selectedChamber ? {
      nombre: selectedChamber.nombre,
      grupo: selectedChamber.grupo,
      reportLabel: selectedChamber.reportado ? 'Sí' : 'No',
      programs: selectedChamber.programIds.map((pid) => {
        const prog = PROGRAMS.find((p) => p.id === pid);
        return { name: prog.name, pctText: selectedChamber.avanceByProgram[pid] + '%' };
      })
    } : null;

    return {
      rows,
      filters,
      programStats,
      hasSelected: !!selected,
      selected: selected ?? { nombre: '', grupo: '', reportLabel: '', programs: [] },
      closeSelected: () => update({ selectedChamber: null }),
      reportedCount,
      pendingCount,
      laggingCount,
      totalChambers: ALL_CHAMBERS.length,
      daysLeft: Math.max(0, daysUntil('2027-01-31'))
    };
  }

function renderMainHeader(vm) {

      <span style="font-size:13px; color:#C9D6E4;">Reporte de gestión · Circular 18/2026</span>
    </div>
    <div style="font-size:13px; color:#C9D6E4;">${esc(vm.camaraHeaderText)}</div>
  </div>

  <div style="display:flex; gap:4px; padding:0 var(--pgx); background:var(--primary-dark); overflow-x:auto;">
    <button onclick="H(${reg(vm.goTo1)})" style="${vm.tab1Style}">1. Perfil y aporte</button>
    <button onclick="H(${reg(vm.goTo2)})" style="${vm.tab2Style}">2. Programas</button>
    <button onclick="H(${reg(vm.goTo3)})" style="${vm.tab3Style}">3. Destinación</button>
    <button onclick="H(${reg(vm.goTo4)})" style="${vm.tab4Style}">4. Ejecución</button>
    <button onclick="H(${reg(vm.goTo5)})" style="${vm.tab5Style}">5. Reporte</button>
    <button onclick="H(${reg(vm.goTo6)})" style="${vm.tab6Style}">6. Panel</button>
    <a href="#" onclick="goToResumen(); return false;" style="padding:14px 18px; font-size:13px; white-space:nowrap; color:#9FB2C6; border-left:1px solid #2A4A6B; border-bottom:3px solid transparent;">📄 Resumen de la Circular</a>
    <a href="#" onclick="goToControl(); return false;" style="margin-left:auto; padding:14px 18px; font-size:13px; white-space:nowrap; color:#F4C89A; border-left:1px solid #2A4A6B; border-bottom:3px solid transparent;">🔒 Panel Confecámaras</a>
  </div>
`;
}

function renderScreen1(vm) {
  return `
  <div style="flex:1; padding:var(--pgy) var(--pgx); display:flex; justify-content:center;">
    <div style="width:100%; max-width:900px; display:flex; flex-direction:column; gap:28px;">

      <div>
        <h2 style="font-size:28px;">Perfil de la cámara y cálculo del aporte</h2>
        <p style="color:var(--muted); font-size:14px; margin-top:8px; max-width:640px;">El grupo se precarga según el Anexo 1 de la Circular 18/2026, según la cámara que elijas. Puede corregirse manualmente, pero eso solo procede si el Ministerio aprobó una solicitud de corrección dentro de los 10 días hábiles siguientes a la comunicación.</p>

      <div style="background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:32px; display:flex; flex-direction:column; gap:24px;">

          <label for="camara-select" style="font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:8px;">Cámara de comercio</label>
          <select id="camara-select" onchange="H(${reg(vm.onCamaraChange)},event)" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid var(--border); border-radius:4px; font-size:15px; background:#fff;">
            ${vm.camaraGroups.map(grp => `
              <optgroup label="${esc(grp.label)}">
                ${grp.chambers.map(c => `<option value="${esc(c)}" ${c === vm.camara ? 'selected' : ''}>${esc(c)}</option>`).join('')}
              </optgroup>
            `).join('')}
          </select>
        </div>

        <div>
          <div style="font-size:13px; font-weight:600; color:var(--muted); margin-bottom:10px;">GRUPO (precargado del Anexo 1 — editable solo tras corrección aprobada)</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${vm.grupos.map(g => `<button onclick="H(${reg(g.select)})" style="${g.pillStyle}">Grupo ${g.id} · ${g.pct}%</button>`).join('')}
          </div>
          ${vm.overridden ? `
            <div style="margin-top:10px; padding:10px 14px; background:var(--warning-bg); color:var(--warning); border-radius:4px; font-size:13px;">
              Este grupo es distinto al asignado en el Anexo 1 (Grupo ${vm.assignedGrupo}). Solo debería cambiarse tras una corrección aprobada por el Ministerio.
            </div>

        <div style="display:flex; gap:32px; flex-wrap:wrap;">
          <div style="flex:1; min-width:260px;">
            <label for="ingresos-input" style="font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:8px;">Ingresos 2025 por servicios públicos delegados</label>
            <input id="ingresos-input" value="${esc(vm.ingresosDisplay)}" oninput="H(${reg(vm.onIngresosChange)},event)" inputmode="numeric" placeholder="Mismo valor reportado a la Superintendencia de Sociedades" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
          </div>
          <div style="flex:1; min-width:260px;">
            <div style="font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px;">Valor del aporte (${vm.pct}%)</div>
            <div style="padding:12px 14px; background:var(--success-bg); border:1px solid var(--success); border-radius:4px; font-size:18px; font-weight:600; color:var(--success);">${vm.aporteFormatted}</div>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; gap:16px;">
          <div style="font-size:14px; color:var(--muted);">Mínimo de programas a adoptar en 2027: <strong style="color:var(--ink);">${vm.minPrograms} de 5</strong></div>
          <button onclick="H(${reg(vm.goTo2)})" style="padding:12px 22px; background:var(--accent); color:#fff; border-radius:4px; font-size:14px; font-weight:600;">Continuar a selección de programas →</button>
        </div>

      </div>

      <div style="font-size:12px; color:var(--muted);">Fuente: Circular Externa 18 de 2026, Ministerio de Comercio, Industria y Turismo — Anexo 1 (clasificación) y Capítulo I (aporte).</div>

    </div>
  </div>
`;
}

function renderInterventionRow(i) {
  return `
    <div style="background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size:12px; font-weight:600; color:var(--muted);">NOMBRE DE LA HERRAMIENTA O DEL PROGRAMA</label>
        ${i.canRemove ? `<button onclick="H(${reg(i.remove)})" style="font-size:12px; color:var(--danger); background:transparent; padding:2px;">Quitar ✕</button>` : ''}
      </div>
      <input value="${esc(i.nombre)}" onchange="H(${reg(i.onNombre)},event)" placeholder="Nombre de la herramienta o del programa" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border); border-radius:4px; font-size:14px;">
      <div>
        <label style="font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px;">¿EN QUÉ CONSISTE?</label>
        <textarea onchange="H(${reg(i.onDescripcion)},event)" placeholder="Describe brevemente en qué consiste la intervención (a quién atiende, cómo se ejecuta, qué entrega)" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border); border-radius:4px; font-size:14px; font-family:'IBM Plex Sans', sans-serif; min-height:64px; resize:vertical;">${esc(i.descripcion)}</textarea>
      </div>
      ${i.hasMinimos ? `
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px;">MÍNIMOS EXIGIDOS POR LA CIRCULAR PARA ESTE PROGRAMA</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${i.minimosRows.map(m => `
              <button onclick="H(${reg(m.toggle)})" style="${m.pillStyle}">
                <span style="${m.checkStyle}">${m.checkMark}</span>
                <span style="font-size:13px;">${esc(m.text)}</span>
              </button>
            `).join('')}
          </div>
        </div>
      ` : ''}

                <span style="font-size:13px; color:var(--muted);">%</span>
              </div>
